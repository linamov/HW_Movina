<!DOCTYPE html>
<html>
<head>
  <title>HW 5.1- Numbers from 20 to 30</title>
</head>
<body> 
 <h1>Homework 5.1: Print numbers from 20 to 30 with step 0.5</h1>
  <script>
    let result = '';
    for (let i = 20; i <= 30; i += 0.5) {
      result += i + ' ';
    }
    console.log(result.trim());
  </script>
</body>
